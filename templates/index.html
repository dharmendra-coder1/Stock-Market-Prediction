<!DOCTYPE html>
<html>
<head>
    <title>Stock Market Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f7;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #2c3e50;
        }
        form {
            background: white;
            padding: 20px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }
        input[type="text"], input[type="date"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #1f618d;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Stock Market Price Prediction</h1>
    <form method="POST">
        <input type="text" name="symbol" placeholder="Enter Stock Symbol (e.g. AAPL)" required><br>
        <label>From Date:</label><br>
        <input type="date" name="from_date" required><br>
        <label>To Date:</label><br>
        <input type="date" name="to_date" required><br>
        <input type="submit" value="Predict">
    </form>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</body>
</html>
